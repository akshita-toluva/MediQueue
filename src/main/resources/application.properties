spring.profiles.include=local
# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MediQueue_DB
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# App name (shows in logs)
spring.application.name=mediqueue

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

#TTL(seconds)
mediqueue.cache.doctor-availability-ttl-seconds=300

mediqueue.admin.bootstrap-secret=${mediqueue.admin.bootstrap-secret}

# --- Rate limiting  ---
# Login: per IP+email stops guessing one password; per IP stops one machine trying many accounts.
mediqueue.rate-limit.login.per-account=5
mediqueue.rate-limit.login.per-ip=30
mediqueue.rate-limit.login.period-seconds=60
# Bootstrap-admin: brute-forcing the bootstrap secret
mediqueue.rate-limit.bootstrap.per-ip=10
mediqueue.rate-limit.bootstrap.period-seconds=900
