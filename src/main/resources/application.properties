spring.profiles.include=local
# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MediQueue_DB
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# App name (shows in logs)
spring.application.name=mediqueue

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

#TTL(seconds)
mediqueue.cache.doctor-availability-ttl-seconds=300


# --- Rate limiting  ---
# Login: per IP+email stops guessing one password; per IP stops one machine trying many accounts.
mediqueue.rate-limit.login.per-account=5
mediqueue.rate-limit.login.per-ip=30
mediqueue.rate-limit.login.period-seconds=60
# Bootstrap-admin: brute-forcing the bootstrap secret
mediqueue.rate-limit.bootstrap.per-ip=10
mediqueue.rate-limit.bootstrap.period-seconds=900

spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

mediqueue.ai.timeout-seconds=20
spring.ai.retry.max-attempts=1

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

mediqueue.admin.bootstrap-only-if-no-admin=true

mediqueue.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}